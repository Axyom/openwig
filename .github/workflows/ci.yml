name: CI

# The mods themselves can't be built here: building needs Bitwig's own jar, which is
# never committed. These checks catch broken scripts and manifests.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile the repo's Python scripts
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Validate mod.json and build.json
        run: python .github/check_manifests.py
      # from pypi-moved/: at the root, python -m build would import the repo's build.py
      - name: Build the moved-package stub
        working-directory: pypi-moved
        run: |
          pip install build
          python -m build
