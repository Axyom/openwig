name: release

# Publishes the "moved" placeholder in pypi-moved/ to PyPI. Mod releases use tags v*
# and a GitHub release with one ZIP per mod; they never publish to PyPI.
# Keep this filename and the pypi environment: PyPI trusted publishing is bound to them.
on:
  push:
    tags: ["pypi-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build pypi-moved --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
